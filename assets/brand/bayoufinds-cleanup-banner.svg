      <path d="M116 15 C70 42 42 86 42 135 c0 66 53 119 119 119 54 0 99-36 114-85 -18 28-50 46-87 46 -59 0-107-48-107-107 0-38 20-72 50-91 -5-1-10-2-15-2z" fill="#2be0cb" opacity="0.9"/>
      <path d="M68 178 C110 151 151 151 193 178" stroke="#d6a84f" stroke-width="12" stroke-linecap="round" fill="none"/>
